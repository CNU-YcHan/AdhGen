[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adhgen"
version = "1.1.0"
description = "Genetic-algorithm framework for biologically guided focal-adhesion segmentation"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "opencv-python",
  "scikit-image",
  "tifffile",
]

[project.scripts]
adhgen-optimize = "adhgen.optimizer:main"
adhgen-holdout = "adhgen.holdout:main"
adhgen-prepare-images = "adhgen.preprocessing:main"

[tool.setuptools.packages.find]
where = ["src"]
